[project]
name = "scripture-chat"
version = "0.1.0"
description = "Local-first scripture evidence service"
requires-python = ">=3.12"
dependencies = [
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.116,<1",
  "mcp>=1.12,<2",
  "pdfplumber>=0.11,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[project.scripts]
scripture-chat = "scripture_chat.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scripture_chat"]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
