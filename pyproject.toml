[project]
name = "scripture-chat"
version = "0.1.0"
description = "Local-first scripture evidence service"
requires-python = ">=3.12"
dependencies = [
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.116,<1",
  "mcp>=1.12,<2",
  "pdfplumber>=0.11,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[project.scripts]
scripture-chat = "scripture_chat.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scripture_chat"]

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=7,<8",
  "reportlab>=4.4,<5",
  "types-defusedxml>=0.7,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
source = ["scripture_chat"]

[tool.coverage.report]
fail_under = 85
show_missing = true
